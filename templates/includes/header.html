<!-- HEADER -->

<nav class="navbar navbar-dark app-header">

    <div class="container-fluid header-container">

        <!-- LEFT -->
        <div class="d-flex align-items-center">

            <button
                type="button"
                id="sidebarToggle"
                class="sidebar-toggle-btn"
                onclick="toggleSidebar()">
                ☰
            </button>

            <a
                class="navbar-brand fw-bold ms-3"
                href="{% url 'dashboard' %}">
                AI Question Generator
            </a>

        </div>

        <!-- RIGHT -->

        {% if user.is_authenticated %}

        <div class="dropdown">


            <button
                class="btn app-user-btn dropdown-toggle text-white"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false">
                👤

                {% if user.first_name %}
                    {{ user.first_name }}
                {% else %}
                    {{ user.username }}
                {% endif %}

            </button>

            <ul class="dropdown-menu dropdown-menu-end">

                <li>
                    <a
                        class="dropdown-item"
                        href="{% url 'password_change' %}">
                        🔑 Change Password
                    </a>
                </li>

                <li>
                    <hr class="dropdown-divider">
                </li>

                <li>
                    <a
                        class="dropdown-item text-danger"
                        href="{% url 'logout' %}">
                        🚪 Logout
                    </a>

                </li>

            </ul>

        </div>

        {% endif %}

    </div>

</nav>
